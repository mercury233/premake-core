name: Dev Release

on:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates git uuid-dev
      - name: Build release x64 with GCC and contrib libraries
        run: CC=gcc PLATFORM=x64 CONFIG=release PREMAKE_OPTS="--lib-src=contrib --cc=gcc" ./Bootstrap.sh
      - name: Package
        run: |
          mkdir -p dist/package
          cp bin/release/premake5 dist/package/premake5
          tar -C dist/package -czf dist/premake-dev-linux-x64.tar.gz premake5
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: premake-dev-linux-x64
          path: dist/premake-dev-linux-x64.tar.gz
          retention-days: 1

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build release Win32 with VS2022 and MSC
        shell: cmd
        env:
          PLATFORM: Win32
          CONFIG: release
        run: .\Bootstrap.bat vs2022 "PREMAKE_OPTS=--cc=msc"
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist\package -Force
          Copy-Item bin\release\premake5.exe dist\package\premake5.exe
          Compress-Archive -Path dist\package\premake5.exe -DestinationPath dist\premake-dev-windows-win32.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: premake-dev-windows-win32
          path: dist/premake-dev-windows-win32.zip
          retention-days: 1

  macosx:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build release ${{ matrix.platform }}
        run: PLATFORM=${{ matrix.platform }} CONFIG=release ./Bootstrap.sh
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: premake-macosx-${{ matrix.platform }}
          path: bin/release/premake5
          retention-days: 1

  macosx-universal:
    runs-on: macos-latest
    needs: macosx
    timeout-minutes: 5
    steps:
      - name: Download x64 binary
        uses: actions/download-artifact@v8
        with:
          name: premake-macosx-x64
          path: binaries/x64
      - name: Download ARM64 binary
        uses: actions/download-artifact@v8
        with:
          name: premake-macosx-ARM64
          path: binaries/ARM64
      - name: Create and package universal binary
        run: |
          mkdir -p dist/package
          lipo -create binaries/x64/premake5 binaries/ARM64/premake5 -output dist/package/premake5
          chmod +x dist/package/premake5
          lipo dist/package/premake5 -verify_arch x86_64 arm64
          tar -C dist/package -czf dist/premake-dev-macosx-universal.tar.gz premake5
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: premake-dev-macosx-universal
          path: dist/premake-dev-macosx-universal.tar.gz
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [linux, windows, macosx-universal]
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: premake-dev-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          release_tag=$(date -u +'%Y%m%d-%H%M%S')
          gh release create "dev-${release_tag}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_name" \
            --notes "Development build from mercury233's fork at ${GITHUB_SHA}." \
            --prerelease
